name: Generar archivos del sistema

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar-archivos:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar main.py
        run: python main.py

      - name: Verificar archivos generados
        run: |
          echo "Archivos en la raiz:"
          ls -la
          echo "Archivos en logs:"
          ls -la logs || true
          echo "Archivos en exportaciones:"
          ls -la exportaciones || true

      - name: Guardar logs y exportaciones en el repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add logs/log_sistema.txt exportaciones/reservas_exportadas.txt
          git commit -m "Generar logs y reservas exportadas" || echo "No hay cambios nuevos"
          git push
